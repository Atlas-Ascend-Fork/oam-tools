minimum_pre_commit_version: 4.0.0
exclude: ^LICENSES/|\.(html|csv|svg)$

default_stages: [pre-commit]
ci:
  autofix_prs: false
  autoupdate_schedule: monthly

repos:
  # pre-commit 基础检查
  - repo: https://gitcode.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json

  # C++ 代码格式化检查
  - repo: https://gitcode.com/pre-commit-clang/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: \.(c|h|cpp|hpp|cc|hh|cxx|hxx)$
        # 不传 --style 内联配置：该镜像钩子默认 args 为 ["-style=file"]，
        # 即使用仓库根目录 .clang-format。传内联参数会整体覆盖 .clang-format，
        # 导致钩子与开发者手动/IDE 执行 clang-format 的结果不一致。
        # msprof 已整改（存量 C/C++ 已按 .clang-format 格式化），故摘出
        # src/msprof；但 src/msprof/inc/{external,toolchain} 是 vendored SDK
        # 接口头，不归本项目维护，仍屏蔽。
        # test/ 不再逐组件白名单：test/ 下的 C/C++ 全部落在
        # (ut|st)/(asys|msaicerr|msprof)/ 内（msprof 91 + msaicerr 5），
        # 负向前瞻要排除的集合已为空、不再屏蔽任何文件，只剩"每个组件摘除
        # 都要改同一行"的冲突点，故删除。仅保留 test/{ut,st}/msaicerr/res/
        # （采自设备的样本头，不可改写）。
        exclude: |
          (?x)^(
            build/
            | experiment/
            | src/(
              third_party
            )/
            | src/msprof/inc/(external|toolchain)/
            | test/(ut|st)/msaicerr/res/
          )

  # Python 代码检查
  - repo: https://gitcode.com/gh_mirrors/ru/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: ["--output-format", "github", "--fix"]
        types: [python]
        exclude: |
          (?x)^(
            \.claude/
            | cmake/
            | experiment/
            | scripts/
            | skills/
            | test/(?!(host/|(ut|st)/(asys|msaicerr)/))
            | test/(ut|st)/msaicerr/res/
          )
      - id: ruff-format
        types: [python]
        # 屏蔽范围与 ruff-check 一致，理由同上。
        exclude: |
          (?x)^(
            \.claude/
            | cmake/
            | experiment/
            | scripts/
            | skills/
            | test/(?!(host/|(ut|st)/(asys|msaicerr)/))
            | test/(ut|st)/msaicerr/res/
          )

  # Python 安全检查（bandit，仅 medium 及以上严重度）。
  # 用 1.8.6：bandit 1.9.x 要求 Python>=3.10，CI pre-commit 环境是 3.9，
  # 装 1.9.x 会失败。1.8.6 是兼容 Python 3.9 的最新版。
  # 屏蔽范围与 ruff 一致：Asys 与 msaicerr 已整改完毕并纳入扫描，
  # 其余存量目录后续再逐个摘除。test/{ut,st}/msaicerr/res/ 是设备样本与桩包，
  # 不做安全扫描。
  - repo: https://gitcode.com/gh_mirrors/ba/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: [-ll]
        exclude: |
          (?x)^(
            \.claude/
            | cmake/
            | experiment/
            | scripts/
            | skills/
            | test/(?!(host/|(ut|st)/(asys|msaicerr)/))
            | test/(ut|st)/msaicerr/res/
          )

  # 拼写检查
  - repo: https://gitcode.com/gh_mirrors/co/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        # -L 词表 = 社区模板词表 + 主线原 ignore-words-list 的项目专有词
        # （oam/msprof/aicerr/hccl/te/nin/fo/optin/abl/OpEnd/mata/VALU/nd/enque）。
        # 注意：codespell 小写词条大小写不敏感（cann 即可压住 CANN/Cann），
        # 带大写的词条仅精确匹配（ND 压不住 nd），故模板大写词与主线小写词并存。
        # modeE 是 msprof FileDataParams 构造参数（同行 fileNameStr/isLastChunkB
        # 按"类型首字母后缀"命名以避开同名成员 mode），非拼写错误，故加白。
        # --skip 不跳过源码文件（与主线行为一致，主线 codespell 一直检查
        # .py/.cpp 等），仅跳过二进制/构建产物目录；test/*/*/res/* 是采集自
        # 设备的原始日志/落盘样本，不能改写，整目录跳过（fnmatch 需尾部 /*
        # 且不能带 ./ 前缀才能命中嵌套文件）。
        args: [
            "-L",
            "CANN,cann,NNAL,nnal,ASCEND,ascend,EnQue,CopyIn,ArchType,AND,ND,tbe,copyin,alog,oam,msprof,aicerr,hccl,te,nin,fo,optin,abl,OpEnd,mata,VALU,nd,enque,datas,WRON,modeE,AER,UE",
            "--skip",
            "*.bin,*.xlsx,*.png,*.svg,*.lock,*.whl,*.pyc,./build,./bundle,./submodule,./third_party,./node_modules,test/*/*/res/*",
          ]

  # typos 检查
  - repo: https://gitcode.com/gh_mirrors/ty/typos
    rev: v1.32.0
    hooks:
      - id: typos
        args: ["--force-exclude"]
        exclude: |
          (?x)^(
            \.claude/
            | cmake/
            | experiment/
            | scripts/
            | skills/
            | src/(
              msprof
              | third_party
            )/
            | test/(?!(host/|(ut|st)/(asys|msaicerr)/))
            | test/(ut|st)/asys/data/
            | test/(ut|st)/msaicerr/res/
          )

  # OAT 合规性检查 (Open Source Audit Tool)
  # require_serial + pass_filenames=false：oat_check.sh 内部自行收集 staged
  # 文件，只调用一次。避免 pass_filenames=true 时每文件单独触发一次 OAT
  # 扫描，导致 oat-py 在 CI 环境中偶发不生成 PlainReport 报告而误报失败。
  - repo: local
    hooks:
      - id: oat-check
        name: OAT Compliance Check
        entry: bash scripts/oat_check.sh
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]
        verbose: true
